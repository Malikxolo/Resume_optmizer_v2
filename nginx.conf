# ═══════════════════════════════════════════════════════════════════════════════
# Nginx — Reverse Proxy + Load Balancer
# Supports:
#   1. Salesbot API (api.totalcareservices.me)
#   2. Resume Optimizer API (resume-api.totalcareservices.me)
#   3. Grafana Monitoring (monitor.totalcareservices.me)
# ═══════════════════════════════════════════════════════════════════════════════

# ── Upstream: Backend API containers (Salesbot) ────────────────────────────────
upstream backend_servers {
    least_conn;
    server backend-1:8001;
    server backend-2:8002;
}

# ── Upstream: Resume Optimizer Backend Container ──────────────────────────────
upstream resume_backend {
    server resume-optimizer-backend:8005;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt / ACME challenge (for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server: Salesbot API ────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.totalcareservices.me;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API Routes → Salesbot Backend
    location /api/ {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }

    # Health Check endpoint
    location /health {
        proxy_pass http://backend_servers/api/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404 '{"error": "Not found. API endpoints are under /api/"}';
        add_header Content-Type application/json;
    }
}

# ── HTTPS server: Resume Optimizer API ────────────────────────────────────────
server {
    listen 443 ssl;
    server_name resume-api.totalcareservices.me;

    # SSL certificates for resume-api subdomain (mounted via Let's Encrypt / Docker)
    ssl_certificate     /etc/letsencrypt/live/resume-api.totalcareservices.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resume-api.totalcareservices.me/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API Routes → Resume Optimizer Backend Container
    location /api/ {
        proxy_pass http://resume_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE Real-Time Streaming
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health Check endpoint
    location /health {
        proxy_pass http://resume_backend/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404 '{"error": "Not found. API endpoints are under /api/"}';
        add_header Content-Type application/json;
    }
}

# ── HTTPS server for Grafana Monitoring ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name monitor.totalcareservices.me;

    ssl_certificate     /etc/nginx/ssl/monitor_fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/monitor_privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
